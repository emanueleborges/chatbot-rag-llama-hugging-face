# Use com: docker compose -f docker-compose.yml -f docker-compose.ollama.yml up --build
# Sobe Ollama na mesma rede que a app; a app fala em http://ollama:11434/v1
#
# Após o primeiro arranque, o modelo pode ainda não existir no volume. Execute:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml exec ollama ollama pull llama3.2:1b

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  app:
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_API_KEY: ollama
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}

volumes:
  ollama_models:
