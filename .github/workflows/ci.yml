# Testes + build Docker + integração Ollama (serviço em contentor, sem secrets na nuvem).
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências (incl. pytest)
        run: pip install -r requirements-dev.txt

      - name: Testes (roteamento + RAG local, sem API keys)
        run: pytest

      - name: Build imagem produção (sem .env na imagem)
        run: docker build -t rag-chat:ci .

      - name: Build estágio de testes na imagem
        run: docker build --target ci -t rag-chat:test .

  # Push à main/master ou execução manual (evita pull grande em cada PR).
  integration-ollama:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) }}
    needs: test
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    env:
      OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
      OLLAMA_API_KEY: ollama
      OLLAMA_MODEL: llama3.2:1b
      OLLAMA_PULL_HOST: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências da app
        run: pip install -r requirements.txt

      - name: Aguardar Ollama e obter modelo
        run: python scripts/wait_for_ollama_model.py

      - name: Smoke LLM (chat_engine → Ollama)
        run: python scripts/smoke_ollama_chat.py
