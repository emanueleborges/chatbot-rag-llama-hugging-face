  #Opcional: descomente e defina o secret OLLAMA_API_KEY no GitHub (Settings → Secrets).
  #Desencadeia só em push à main, para não gastar quota em cada PR de fork.
  integration-ollama:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != ''
    needs: test
    runs-on: ubuntu-latest
   ps:
      - uses: actions/checkout@v4
      - env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
    ste uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Smoke LLM (falha se secret não existir)
        run: python -c "
          import os, asyncio
          from chat_engine import process_chat
          async def main():
            r = await process_chat('diga apenas OK', [])
            assert not r.get('error')
          asyncio.run(main())
          "
