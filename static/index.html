<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat RAG</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <style>
    :root {
      --bg: #0b0c0f;
      --surface: #141519;
      --surface-2: #1c1d23;
      --border: #2a2b32;
      --text: #e8e8ea;
      --muted: #8b8d98;
      --accent: #4dc0e8;
      --accent-dim: #2a8fb5;
      --user-bubble: #1a2d42;
      --assistant-bubble: #1e1f26;
      --danger: #f87171;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
    .app { display: flex; height: 100%; min-height: 0; }
    aside {
      width: 260px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .brand {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #0b0c0f;
    }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    .brand span { font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }
    .side-scroll { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    button, .btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 10px 14px; background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); transition: background 0.15s, border-color 0.15s;
    }
    button:hover, .btn:hover { background: #25262e; border-color: #3f4049; }
    .btn-primary {
      background: linear-gradient(180deg, #2a9ec4, var(--accent-dim));
      border-color: transparent; color: #061016; font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-ghost { background: transparent; }
    label.file-btn {
      display: block; text-align: center; cursor: pointer; padding: 10px;
      border-radius: 10px; border: 1px dashed var(--border); color: var(--muted); font-size: 13px;
    }
    label.file-btn:hover { border-color: var(--accent-dim); color: var(--text); }
    input[type="file"] { display: none; }
    .login-box {
      padding: 12px; border-top: 1px solid var(--border);
      background: var(--surface-2);
    }
    .login-box h2 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .login-box input {
      width: 100%; margin-bottom: 8px; padding: 9px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: #0f1014; color: var(--text); font: inherit;
    }
    .login-box input:focus { outline: none; border-color: var(--accent-dim); }
    .status { font-size: 11px; color: var(--muted); padding: 0 12px 10px; }
    .status.ok { color: #4ade80; }
    .status.err { color: var(--danger); }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    header.main-h {
      height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; border-bottom: 1px solid var(--border); background: rgba(11,12,15,0.85); backdrop-filter: blur(8px);
    }
    header.main-h strong { font-size: 14px; font-weight: 500; }
    header.main-h small { color: var(--muted); font-size: 12px; margin-left: 8px; }
    .messages {
      flex: 1; overflow-y: auto; padding: 24px 16px 120px;
      max-width: 880px; width: 100%; margin: 0 auto;
    }
    .msg { display: flex; margin-bottom: 20px; gap: 12px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    }
    .msg.user .avatar { background: var(--user-bubble); color: var(--accent); border-color: #2a4a66; }
    .bubble {
      max-width: min(720px, 100%); padding: 14px 16px; border-radius: var(--radius);
      line-height: 1.55; font-size: 15px; border: 1px solid var(--border);
      background: var(--assistant-bubble);
    }
    .msg.user .bubble {
      background: var(--user-bubble); border-color: #2a4a66;
    }
    .bubble p { margin: 0 0 0.6em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble pre { margin: 0.5em 0; padding: 12px; background: #0f1014; border-radius: 8px; overflow-x: auto; font-size: 13px; border: 1px solid var(--border); }
    .bubble code { font-family: ui-monospace, Consolas, monospace; font-size: 0.9em; }
    .composer-wrap {
      position: sticky; bottom: 0; padding: 16px; background: linear-gradient(180deg, transparent, var(--bg) 28%);
      border-top: 1px solid var(--border);
    }
    .composer {
      max-width: 880px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px 10px;
    }
    .composer textarea {
      flex: 1; resize: none; min-height: 44px; max-height: 200px; border: none; background: transparent;
      color: var(--text); font: inherit; font-size: 15px; line-height: 1.45; padding: 8px 6px;
    }
    .composer textarea:focus { outline: none; }
    .composer .send {
      width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: #061016; border: none; cursor: pointer;
    }
    .composer .send:disabled { opacity: 0.45; cursor: not-allowed; }
    .composer .send svg { width: 20px; height: 20px; }
    .typing { color: var(--muted); font-size: 13px; padding: 0 20px 8px; max-width: 880px; margin: 0 auto; }
    @media (max-width: 720px) {
      aside {
        position: fixed; left: 0; top: 0; bottom: 0; z-index: 30;
        width: min(280px, 88vw);
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: 8px 0 32px rgba(0,0,0,0.45);
      }
      aside.open { transform: translateX(0); }
      .menu-btn { display: flex !important; align-items: center; justify-content: center; padding: 8px 12px; }
    }
    .menu-btn { display: none; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div>
          <h1>Chat RAG</h1>
          <span>Assistente com contexto</span>
        </div>
      </div>
      <div class="side-scroll">
        <button type="button" class="btn btn-primary" id="btnNew">Novo chat</button>
        <label class="file-btn">Enviar .txt<input type="file" id="fileDoc" accept=".txt,text/plain" /></label>
      </div>
      <div class="login-box">
        <h2>Sessão</h2>
        <input type="text" id="user" placeholder="Utilizador" autocomplete="username" value="admin" />
        <input type="password" id="pass" placeholder="Palavra-passe" autocomplete="current-password" value="admin123" />
        <button type="button" class="btn btn-primary" id="btnLogin" style="width:100%">Entrar</button>
      </div>
      <div class="status" id="status"></div>
    </aside>
    <main>
      <header class="main-h">
        <div style="display:flex;align-items:center">
          <button type="button" class="btn menu-btn" id="btnToggleSide" aria-label="Menu">☰</button>
          <strong>Conversa</strong><small id="sessionLabel"></small>
        </div>
        <button type="button" class="btn btn-ghost" id="btnLogout">Sair</button>
      </header>
      <div class="messages" id="messages"></div>
      <div class="typing" id="typing" style="display:none">A pensar…</div>
      <div class="composer-wrap">
        <form class="composer" id="formChat">
          <textarea id="input" rows="1" placeholder="Mensagem… (Enter envia, Shift+Enter nova linha)" maxlength="8000"></textarea>
          <button type="submit" class="send" id="btnSend" title="Enviar" aria-label="Enviar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </form>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js" crossorigin></script>
  <script>
(function () {
  const $ = (s) => document.querySelector(s);
  const messagesEl = $("#messages");
  const statusEl = $("#status");
  const sessionLabel = $("#sessionLabel");
  const input = $("#input");
  const typing = $("#typing");

  let token = sessionStorage.getItem("rag_token") || "";
  let sessionId = sessionStorage.getItem("rag_session") || crypto.randomUUID();
  sessionStorage.setItem("rag_session", sessionId);
  sessionLabel.textContent = " · " + sessionId.slice(0, 8) + "…";

  function setStatus(text, cls) {
    statusEl.textContent = text || "";
    statusEl.className = "status" + (cls ? " " + cls : "");
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function renderMarkdown(text) {
    if (typeof marked !== "undefined" && typeof DOMPurify !== "undefined") {
      const raw = marked.parse(text, { breaks: true, mangle: false, headerIds: false });
      return DOMPurify.sanitize(raw, { USE_PROFILES: { html: true } });
    }
    return "<p>" + escapeHtml(text).replace(/\n/g, "<br/>") + "</p>";
  }

  function addMessage(role, htmlOrText, isHtml) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + (role === "user" ? "user" : "assistant");
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = role === "user" ? "Tu" : "AI";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (isHtml) bubble.innerHTML = htmlOrText;
    else bubble.innerHTML = "<p>" + escapeHtml(htmlOrText).replace(/\n/g, "<br/>") + "</p>";
    wrap.appendChild(av);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollBottom();
    return bubble;
  }

  async function login() {
    const u = $("#user").value.trim();
    const p = $("#pass").value;
    setStatus("A ligar…");
    try {
      const r = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p }),
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
      const data = await r.json();
      token = data.access_token;
      sessionStorage.setItem("rag_token", token);
      setStatus("Sessão ativa.", "ok");
    } catch (e) {
      token = "";
      sessionStorage.removeItem("rag_token");
      setStatus(String(e.message || e), "err");
    }
  }

  function logout() {
    token = "";
    sessionStorage.removeItem("rag_token");
    setStatus("Sessão terminada.");
  }

  function newChat() {
    sessionId = crypto.randomUUID();
    sessionStorage.setItem("rag_session", sessionId);
    sessionLabel.textContent = " · " + sessionId.slice(0, 8) + "…";
    messagesEl.innerHTML = "";
    setStatus(token ? "Novo chat." : "Entre para continuar.", token ? "ok" : "");
  }

  async function uploadFile(ev) {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f || !token) { setStatus("Entre primeiro.", "err"); return; }
    setStatus("A enviar documento…");
    const fd = new FormData();
    fd.append("file", f, f.name);
    try {
      const r = await fetch("/documents/upload", {
        method: "POST",
        headers: { Authorization: "Bearer " + token },
        body: fd,
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
      const d = await r.json();
      setStatus("Documento: " + (d.chunks || 0) + " chunks.", "ok");
    } catch (e) {
      setStatus(String(e.message || e), "err");
    }
  }

  async function sendMessage(text) {
    if (!token) { setStatus("Precisa de entrar.", "err"); return; }
    addMessage("user", text, false);
    const bubble = addMessage("assistant", "", false);
    bubble.innerHTML = "";
    const acc = document.createElement("div");
    acc.className = "md";
    bubble.appendChild(acc);
    typing.style.display = "block";
    $("#btnSend").disabled = true;

    let full = "";
    try {
      const r = await fetch("/chat/stream", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
        },
        body: JSON.stringify({ message: text, session_id: sessionId, use_cache: true }),
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
      const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += value;
        const parts = buf.split("\n\n");
        buf = parts.pop() || "";
        for (const block of parts) {
          const lines = block.split("\n");
          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const data = line.slice(6).trimEnd();
              if (data === "[DONE]") continue;
              full += data;
              acc.innerHTML = renderMarkdown(full);
              scrollBottom();
            }
          }
        }
      }
      if (buf.trim()) {
        const line = buf.includes("data: ") ? buf.split("data: ").pop() : buf;
        const data = line.replace(/^data:\s*/, "").split("\n")[0];
        if (data && data !== "[DONE]") full += data;
      }
      acc.innerHTML = renderMarkdown(full);
    } catch (e) {
      acc.innerHTML = "<p style=color:var(--danger)>" + escapeHtml(String(e.message || e)) + "</p>";
    } finally {
      typing.style.display = "none";
      $("#btnSend").disabled = false;
      scrollBottom();
    }
  }

  $("#btnLogin").addEventListener("click", login);
  $("#btnLogout").addEventListener("click", logout);
  $("#btnNew").addEventListener("click", newChat);
  $("#fileDoc").addEventListener("change", uploadFile);
  $("#formChat").addEventListener("submit", function (ev) {
    ev.preventDefault();
    const t = input.value.trim();
    if (!t) return;
    input.value = "";
    input.style.height = "auto";
    sendMessage(t);
  });
  input.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      $("#formChat").requestSubmit();
    }
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  });

  $("#btnToggleSide").addEventListener("click", function () {
    $("#sidebar").classList.toggle("open");
  });
  if (window.matchMedia("(max-width: 720px)").matches) {
    $("#btnToggleSide").style.display = "flex";
  }

  if (token) setStatus("Sessão restaurada.", "ok");
})();
  </script>
</body>
</html>
